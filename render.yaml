services:
  - type: web
    name: velo-app
    env: python
    region: oregon
    plan: free
    buildCommand: "apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
