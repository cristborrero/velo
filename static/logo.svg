<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- Isotipo: abstract download arrow composed of two converging lines -->
  <g>
    <!-- Outer frame — tilted square with rounded corners -->
    <rect x="4" y="4" width="40" height="40" rx="10" fill="none" stroke="#F4F4F5" stroke-width="1.5"/>
    <!-- Arrow shaft -->
    <line x1="24" y1="12" x2="24" y2="32" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round"/>
    <!-- Arrow head left -->
    <line x1="16" y1="26" x2="24" y2="34" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow head right -->
    <line x1="32" y1="26" x2="24" y2="34" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Base line -->
    <line x1="14" y1="38" x2="34" y2="38" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Logotype -->
  <text x="56" y="34" font-family="'Plus Jakarta Sans', 'SF Pro Display', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.04em" fill="#F4F4F5">Velo</text>
</svg>
